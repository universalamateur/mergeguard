#.gitlab-ci.yml

# ==========================================================================
# 1. WORKFLOW CONTROL
# ==========================================================================
# This section defines the global rules for pipeline creation. It's the
# first thing GitLab evaluates. Its purpose is to ensure pipelines run ONLY
# for the events we care about, preventing wasteful duplicate pipelines.
#
# The logic is as follows:
# - Rule 1: Always create a pipeline for merge request events.
# - Rule 2: Always create a pipeline for commits to the default branch (e.g., 'main' or 'master').
# - Rule 3: Always create a pipeline for tags (for releases).
# - Rule 4: NEVER create a branch pipeline if a merge request is already open for that branch.
#   This is the key rule to prevent duplicate pipelines.
# - Rule 5: A fallback to allow manual pipeline runs from the UI ('web') and for scheduled pipelines.
#
# For more details, see: https://docs.gitlab.com/ee/ci/yaml/workflow.html
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

# ==========================================================================
# 2. STAGES
# ==========================================================================
# Stages are defined for logical grouping and visualization in the UI.
# The actual execution order can be determined by the `needs` keyword.
stages:
  - ❄️ validate
  - 🛠 build
  - 🚂 test
  - ⚙️ Run
  - 🚀 staging
  - 🐍 deploy
  - 🛑 Stop
  - 📚 cleanup

# ==========================================================================
# 3. JOB TEMPLATES & DEFAULTS
# ==========================================================================
# Use YAML anchors for reusable configuration blocks to keep the file DRY.
.default_rules:
  rules:
    # Only run jobs on merge requests and the default branch.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# This job runs first to check for merge conflicts.
# ─────────────────────────────────────────────────────────────
#  ❄️  Validate – Detect merge conflicts with rich debugging
# ─────────────────────────────────────────────────────────────
check-merge-conflict:
  stage: ❄️ validate
  image: alpine:latest
  # Run only for merge‑request pipelines
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  # Adjustable polling knobs
  variables:
    POLL_INTERVAL: "5"   # seconds between polls
    MAX_ATTEMPTS: "24"   # 24 × 5 s ≈ 2 min total
  before_script:
    # ‘diffutils’ adds the real GNU diff (busybox’s diff is limited)
    - apk add --no-cache curl jq diffutils
  script:
    - |
      set -euo pipefail                              # safer bash
      echo "🔍 Checking MR !${CI_MERGE_REQUEST_IID} for conflicts…"

      BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
      QUERY="?with_merge_status_recheck=true"        # only appended to the very first call

      mkdir -p responses

      for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
        URL="${BASE_URL}${QUERY}"
        printf "\n──────────────── Attempt %s/%s ────────────────\n" "$attempt" "$MAX_ATTEMPTS"
        echo "📨 Request: GET ${URL}"

        # Do the request, saving headers and body separately
        HEADER_FILE="responses/headers_${attempt}.txt"
        BODY_FILE="responses/body_${attempt}.json"

        # --fail: non‑2xx ⇒ non‑zero exit; -D: save headers; -o: save body; -w: HTTP code
        HTTP_CODE=$(curl --fail --silent --show-error --location \
                         -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
                         -D "${HEADER_FILE}" -o "${BODY_FILE}" \
                         -w '%{http_code}' "${URL}" )
        CURL_CODE=$?

        echo "🌐 HTTP status: ${HTTP_CODE} | curl exit code: ${CURL_CODE}"
        echo "📥 Response headers:"
        cat "${HEADER_FILE}"
        echo "📦 Response body (pretty‑printed):"
        jq . < "${BODY_FILE}"

        # Diff against the previous response, if any
        if [ "$attempt" -gt 1 ]; then
          echo "🔀 Diff vs previous response:"
          diff -u "responses/body_$((attempt-1)).json" "${BODY_FILE}" || true
        fi

        # Extract and act on merge status
        MERGE_STATUS=$(jq -r '.detailed_merge_status' < "${BODY_FILE}")
        echo "🔖 Parsed merge status: ${MERGE_STATUS}"

        case "${MERGE_STATUS}" in
          can_be_merged)
            echo "✅  No merge conflicts. Proceeding with pipeline."
            exit 0
            ;;
          cannot_be_merged)
            echo "❌  Merge conflict detected. Aborting pipeline."
            exit 1
            ;;
          checking)
            echo "⏳  GitLab is still checking… sleeping ${POLL_INTERVAL}s."
            sleep "${POLL_INTERVAL}"
            QUERY=""                      # subsequent calls drop the recheck flag
            ;;
          *)
            echo "⚠️  Unexpected status '${MERGE_STATUS}'. Assuming safe and continuing."
            exit 0
            ;;
        esac
      done

      echo "⏰  Timeout after $((POLL_INTERVAL * MAX_ATTEMPTS))s without a final answer."
      exit 1

  # Keep every request/response for later inspection
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - responses/

# Example subsequent job that will not run if the above job fails
run-tests:
  stage: 🚂 test
  script:
    - |
      echo "--- 🔍 Inspecting CI/CD Variables ---"
      echo "Project ID:              $CI_PROJECT_ID"
      echo "Merge Request IID:       $CI_MERGE_REQUEST_IID"
      echo "Merge Request Title:     '$CI_MERGE_REQUEST_TITLE'"
      echo "Source Branch:           $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "Target Branch:           $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      echo "GitLab API v4 URL:       $CI_API_V4_URL"
      echo "CI Job Token:            $CI_JOB_TOKEN"
      echo "------------------------------------"

