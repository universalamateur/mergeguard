#.gitlab-ci.yml

# ==========================================================================
# 1. WORKFLOW CONTROL
# ==========================================================================
# This section defines the global rules for pipeline creation. It's the
# first thing GitLab evaluates. Its purpose is to ensure pipelines run ONLY
# for the events we care about, preventing wasteful duplicate pipelines.
#
# The logic is as follows:
# - Rule 1: Always create a pipeline for merge request events.
# - Rule 2: Always create a pipeline for commits to the default branch (e.g., 'main' or 'master').
# - Rule 3: Always create a pipeline for tags (for releases).
# - Rule 4: NEVER create a branch pipeline if a merge request is already open for that branch.
#   This is the key rule to prevent duplicate pipelines.
# - Rule 5: A fallback to allow manual pipeline runs from the UI ('web') and for scheduled pipelines.
#
# For more details, see: https://docs.gitlab.com/ee/ci/yaml/workflow.html
#.gitlab-ci.yml
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

# ==========================================================================
# 2. STAGES
# ==========================================================================
stages:
  - ❄️ validate
  - 🛠 build
  - 🚂 test
  - ⚙️ Run
  - 🚀 staging
  - 🐍 deploy
  - 🛑 Stop
  - 📚 cleanup

# ==========================================================================
# 3. JOB TEMPLATES & DEFAULTS
# ==========================================================================
.default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ==========================================================================
# 4. VALIDATION JOBS
# ==========================================================================
# Job 1: Polls the GitLab API for a detailed merge status.
check-merge-status:
  stage: .pre
  image: alpine:latest
  extends: .default_rules
  before_script:
    - apk add --no-cache curl jq diffutils
  script:
    - |
      set -euo pipefail
      echo "🔍 [API Check] Checking merge request !${CI_MERGE_REQUEST_IID} for mergeability..."

      # --- Configuration ---
      POLL_INTERVAL=10
      MAX_ATTEMPTS=18 # 18 attempts * 10s = 3 minutes timeout
      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
      
      # --- Initial API Call ---
      echo "Fetching initial MR data and triggering a status recheck..."
      PREVIOUS_RESPONSE=$(curl --silent --show-error --fail \
        -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API_URL}?with_merge_status_recheck=true" | jq --sort-keys .)

      echo "------------------- Initial Merge Request State -------------------"
      echo "${PREVIOUS_RESPONSE}"
      echo "---------------------------------------------------------------------"
      
      # --- Polling Loop ---
      for i in $(seq 1 $MAX_ATTEMPTS); do
        if [ $i -gt 1 ]; then
          sleep ${POLL_INTERVAL}
          echo -e "\nAttempt ${i}/${MAX_ATTEMPTS}: Re-querying MR status..."
          CURRENT_RESPONSE=$(curl --silent --show-error --fail \
            -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API_URL}" | jq --sort-keys .)
          
          echo "🔄 Diffs from previous state:"
          diff -u <(echo "${PREVIOUS_RESPONSE}") <(echo "${CURRENT_RESPONSE}") || true
          
          PREVIOUS_RESPONSE="${CURRENT_RESPONSE}"
        else
          echo -e "\nAttempt 1/${MAX_ATTEMPTS}: Analyzing initial MR status..."
          CURRENT_RESPONSE="${PREVIOUS_RESPONSE}"
        fi

        DETAILED_STATUS=$(echo "${CURRENT_RESPONSE}" | jq -r '.detailed_merge_status')
        echo "🔖 Current detailed_merge_status: ${DETAILED_STATUS}"

        case "${DETAILED_STATUS}" in
          "mergeable")
            echo "✅ [API Check] Success: MR is mergeable. Pipeline can proceed."
            exit 0
            ;;
          "conflict" | "need_rebase")
            echo "❌ [API Check] Fatal Error: MR has a hard conflict. To fix, please '${DETAILED_STATUS}' the source branch."
            exit 1
            ;;
          "discussions_not_resolved" | "not_approved" | "requested_changes" | "merge_request_blocked" | "not_open" | "security_policy_violations" | "jira_association_missing" | "locked_paths" | "locked_lfs_files" | "title_regex" | "commits_status")
            echo "❌ [API Check] Policy Error: MR is blocked by a project policy: '${DETAILED_STATUS}'. Please resolve the issue in the MR view."
            exit 1
            ;;
          "draft_status" | "ci_still_running")
            SIMPLE_STATUS=$(echo "${CURRENT_RESPONSE}" | jq -r '.merge_status')
            if [ "${SIMPLE_STATUS}" == "can_be_merged" ]; then
              echo "✅ [API Check] Success: Status is '${DETAILED_STATUS}', but MR is otherwise mergeable. Continuing."
              exit 0
            else
              echo "⏳ [API Check] Status is '${DETAILED_STATUS}' and not yet mergeable. Continuing to poll..."
            fi
            ;;
          *) # All other statuses are asynchronous/transitional
            echo "⏳ [API Check] Status is '${DETAILED_STATUS}'. This is a transitional state. Waiting for next poll..."
            ;;
        esac
      done

      echo "⏰ [API Check] Error: Timed out waiting for a terminal merge status."
      exit 1

# Job 2: Uses Git directly to check for merge conflicts.
check-merge-conflict-git:
  stage: .pre
  image: alpine:latest
  extends: .default_rules
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      echo "🔍 [Git Check] Performing a local merge test..."
      
      git config --global user.name "GitLab CI"
      git config --global user.email "gitlab-ci@example.com"
      
      echo "Fetching target branch '${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}'..."
      git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      
      echo "Attempting to merge target into source branch locally..."
      git merge --no-commit --no-ff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      
      echo "✅ [Git Check] Success: No git conflicts detected. The branches can be merged."
      
# Example subsequent job that will not run if the above job fails
run-tests:
  stage: 🚂 test
  extends: .default_rules # Apply the default rules here as well
  script:
    - |
      echo "--- 🔍 Inspecting CI/CD Variables ---"
      echo "Project ID:              $CI_PROJECT_ID"
      echo "Merge Request IID:       $CI_MERGE_REQUEST_IID"
      echo "Merge Request Title:     '$CI_MERGE_REQUEST_TITLE'"
      echo "Source Branch:           $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "Target Branch:           $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      echo "GitLab API v4 URL:       $CI_API_V4_URL"
      echo "CI Job Token:            Is a secret"
      echo "------------------------------------"